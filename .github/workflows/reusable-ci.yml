name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      test-command:
        required: true
        type: string

jobs:
  setup:
    outputs:
      test-result: "Resultado de las pruebas"
      value: ${{ steps.tests.outputs.test-result }}

    runs-on: [self-hosted, devops-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Show Node Version
        run: node --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        id: tests
        run: |
          ${{ inputs.test-command }}
          echo "test-result=passed" >> "$GITHUB_OUTPUT"

