name: Angular DevOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test Angular Application
    runs-on: [self-hosted, devops-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

  build:
    name: Build Angular Application
    runs-on: [self-hosted, devops-lab]
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: dist/angular-devops-lab

  deploy-development:
    name: Deploy Development
    runs-on: [self-hosted, devops-lab]
    needs: build

    steps:
      - name: Download Angular build
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: dist/angular-devops-lab

      - name: Verify downloaded artifact
        run: |
          echo "Contenido descargado:"
          find dist/angular-devops-lab -maxdepth 2 -type f

      - name: Build Docker image
        run: docker build -t angular-devops-lab:1.0 .
