name: CI DevOps Angular

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Test Angular Application
    runs-on: [self-hosted, devops-lab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

  build:
    name: Build Angular Application
    runs-on: [self-hosted, devops-lab]
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: dist/angular-devops-lab
